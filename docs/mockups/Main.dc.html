<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Ballot</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anton&family=Archivo:wght@400;600&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>
body{margin:0;background:#121010}
a{color:#ff6a13}a:hover{color:#ffd60a}
input{outline:none}
.nm:focus{border-bottom-color:#ff6a13}
.stk::placeholder{color:#7a716b;opacity:1}
.nm::placeholder{color:#7a716b;opacity:1}
input:focus-visible,a:focus-visible,button:focus-visible{outline:2px solid #ffd60a;outline-offset:3px}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; padding: 32px 20px 24px; background: #121010; color: #f3efe8; font-family: Archivo, system-ui, sans-serif; font-size: 16px; line-height: 1.4; display: flex; flex-direction: column; gap: 22px">
  <header style="display: flex; flex-direction: column; gap: 14px">
    <div style="position: relative; align-self: flex-start; margin-top: 8px; transform: rotate(-3deg)">
      <h1 style="margin: 0; display: flex; flex-direction: column; gap: 4px; padding: 14px 30px 14px 46px; background: #ffd60a; color: #141212; clip-path: polygon(28px 0, 100% 0, 100% 100%, 28px 100%, 0 50%); font-family: Anton, Impact, 'Arial Narrow', sans-serif; font-weight: 400; line-height: 0.9; text-transform: uppercase">
        <span style="font-size: 24px; letter-spacing: 0.18em">Discount</span>
        <span style="font-size: 52px; letter-spacing: 0.01em">Halloween</span>
      </h1>
      <span aria-hidden="true" style="position: absolute; left: 15px; top: 50%; width: 12px; height: 12px; margin-top: -6px; border-radius: 50%; background: #121010"></span>
      <span aria-hidden="true" style="position: absolute; right: -16px; top: -18px; width: 64px; height: 64px; border-radius: 50%; background: #ff6a13; color: #141212; display: flex; flex-direction: column; align-items: center; justify-content: center; transform: rotate(14deg); font-family: Anton, Impact, sans-serif; font-size: 22px; line-height: 0.9; text-transform: uppercase"><span>70%</span><span style="font-size: 14px">off</span></span>
    </div>
    <p style="margin: 0; font-family: 'IBM Plex Mono', ui-monospace, monospace; font-size: 12px; letter-spacing: 0.08em; text-transform: uppercase; color: #9a918a">Costume ballot · Voting open</p>
  </header>

  <label for="voter-name" style="display: flex; flex-direction: column; gap: 4px">
    <span style="font-family: 'IBM Plex Mono', ui-monospace, monospace; font-size: 12px; letter-spacing: 0.08em; text-transform: uppercase; color: #9a918a">Your name</span>
    <input id="voter-name" class="nm" type="text" autocomplete="name" placeholder="So we know who voted" value="{{name}}" onChange="{{setName}}" style="font-family: Archivo, system-ui, sans-serif; font-size: 20px; color: #f3efe8; background: transparent; border: 0; border-bottom: 2px solid #3a3431; border-radius: 0; padding: 6px 0">
  </label>

  <div style="display: flex; flex-direction: column; gap: 6px">
    <p style="margin: 0; color: #9a918a; font-size: 15px">Enter the number on the polaroid.</p>
    <div style="display: flex; flex-direction: column; border-top: 2px solid #2c2725">
      <sc-for list="{{cats}}" as="cat" hint-placeholder-count="4">
        <label for="{{cat.id}}" style="display: flex; align-items: center; justify-content: space-between; gap: 16px; padding: 9px 0; border-bottom: 2px solid #2c2725; cursor: text">
          <span style="display: flex; flex-direction: column; gap: 2px; min-width: 0">
            <span style="font-family: Anton, Impact, 'Arial Narrow', sans-serif; font-size: 30px; line-height: 1; text-transform: uppercase; color: #f3efe8">{{cat.label}}</span>
            <sc-if value="{{cat.error}}" hint-placeholder-val="{{false}}">
              <span style="font-family: 'IBM Plex Mono', ui-monospace, monospace; font-size: 12px; letter-spacing: 0.04em; color: #ffd60a">{{cat.errorText}}</span>
            </sc-if>
          </span>
          <span style="flex: none; width: 70px; height: 70px; box-sizing: border-box; border-radius: 50%; display: flex; align-items: center; justify-content: center; gap: 1px; transform: rotate(-7deg); background: {{cat.bg}}; border: 2px {{cat.borderStyle}} {{cat.borderColor}}; color: {{cat.ink}}">
            <span aria-hidden="true" style="font-family: Anton, Impact, sans-serif; font-size: 18px; line-height: 1; margin-top: -10px">#</span>
            <input id="{{cat.id}}" class="stk" type="text" inputmode="numeric" maxlength="2" autocomplete="off" placeholder="–" value="{{cat.value}}" onChange="{{cat.set}}" style="width: 40px; padding: 0; text-align: center; font-family: Anton, Impact, sans-serif; font-size: 32px; line-height: 1; background: transparent; border: 0; color: {{cat.ink}}">
          </span>
        </label>
      </sc-for>
    </div>
  </div>

  <div style="display: flex; flex-direction: column; gap: 10px; margin-top: auto">
    <sc-if value="{{ready}}" hint-placeholder-val="{{false}}">
      <a href="Voted.dc.html" style="display: flex; align-items: center; justify-content: center; height: 56px; background: #ff6a13; color: #141212; font-family: Anton, Impact, sans-serif; font-size: 22px; letter-spacing: 0.02em; text-transform: uppercase; text-decoration: none">Cast ballot</a>
    </sc-if>
    <sc-if value="{{notReady}}" hint-placeholder-val="{{true}}">
      <button type="button" disabled style="height: 56px; border: 0; background: #ff6a13; opacity: 0.35; color: #141212; font-family: Anton, Impact, sans-serif; font-size: 22px; letter-spacing: 0.02em; text-transform: uppercase">Cast ballot</button>
    </sc-if>
    <p style="margin: 0; text-align: center; font-family: 'IBM Plex Mono', ui-monospace, monospace; font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase; color: #9a918a">One ballot per phone. No refunds.</p>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"boardSize":{"editor":"int","default":30,"min":1,"max":99,"section":"Party"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { name: 'Dana', picks: { best: '12', favorite: '7', discount: '', runner: '' } };
  }
  renderVals() {
    const board = this.props.boardSize ?? 30;
    const defs = [['best', 'Best'], ['favorite', 'Favorite'], ['discount', 'Most discount'], ['runner', 'Runner up']];
    let ready = this.state.name.trim().length > 0;
    const cats = defs.map(([k, label]) => {
      const v = this.state.picks[k];
      const n = Number(v);
      const filled = v !== '';
      const valid = filled && Number.isInteger(n) && n >= 1 && n <= board;
      if (!valid) ready = false;
      return {
        id: 'pick-' + k,
        label: label,
        value: v,
        error: filled && !valid,
        errorText: 'No #' + v + ' on the board',
        bg: valid ? '#ffd60a' : 'transparent',
        borderStyle: valid ? 'solid' : 'dashed',
        borderColor: valid ? '#ffd60a' : (filled ? '#ffd60a' : '#5e5652'),
        ink: valid ? '#141212' : '#f3efe8',
        set: (e) => {
          const val = String(e.target.value).replace(/[^0-9]/g, '').slice(0, 2);
          this.setState({ picks: Object.assign({}, this.state.picks, { [k]: val }) });
        }
      };
    });
    return {
      cats: cats,
      name: this.state.name,
      setName: (e) => this.setState({ name: e.target.value }),
      ready: ready,
      notReady: !ready
    };
  }
}
</script>
</body>
</html>
